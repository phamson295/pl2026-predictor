name: Update predictions
on:
  schedule:
    - cron: "0 6 * * *"   # mỗi ngày 06:00 UTC
  workflow_dispatch:        # cho phép bấm chạy tay trên GitHub
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node update.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js history.json
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
